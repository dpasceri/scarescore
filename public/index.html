<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webcam Mirror</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #eee;
    }

    main {
      width: min(960px, 100% - 32px);
      display: grid;
      gap: 12px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Mirror both the video and the overlay together, so landmarks drawn in
       raw video coordinates line up with the mirrored image. */
    .stage video,
    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, select {
      font: inherit;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; cursor: default; }

    .status { margin: 0; color: #aaa; min-height: 1.2em; }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <!-- Overlay for drawing (e.g. MediaPipe face landmarks later). -->
      <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
      <button id="start">Start camera</button>
      <button id="stop" disabled>Stop</button>
      <select id="cameras" aria-label="Camera"></select>
    </div>
    <p id="status" class="status"></p>
  </main>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
    const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const cameraSelect = document.getElementById("cameras");
    const statusEl = document.getElementById("status");

    let stream = null;
    let rafId = null;
    let faceLandmarker = null;
    let lastVideoTime = -1;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    async function loadFaceLandmarker() {
      setStatus("Loading face model‚Ä¶");
      const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
      const options = (delegate) => ({
        baseOptions: { modelAssetPath: MODEL_URL, delegate },
        runningMode: "VIDEO",
        numFaces: 1,
      });
      try {
        faceLandmarker = await FaceLandmarker.createFromOptions(fileset, options("GPU"));
      } catch {
        faceLandmarker = await FaceLandmarker.createFromOptions(fileset, options("CPU"));
      }
      if (!stream) setStatus("");
    }

    async function listCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter((d) => d.kind === "videoinput");
      const current = cameraSelect.value;
      cameraSelect.innerHTML = "";
      cams.forEach((cam, i) => {
        const opt = document.createElement("option");
        opt.value = cam.deviceId;
        opt.textContent = cam.label || `Camera ${i + 1}`;
        cameraSelect.append(opt);
      });
      if (current) cameraSelect.value = current;
      cameraSelect.hidden = cams.length < 2;
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("This browser can't access the camera (needs HTTPS or localhost).");
        return;
      }
      stopCamera();
      try {
        const deviceId = cameraSelect.value;
        stream = await navigator.mediaDevices.getUserMedia({
          video: deviceId
            ? { deviceId: { exact: deviceId } }
            : { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();

        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;

        await listCameras(); // labels are only available after permission is granted
        startBtn.disabled = true;
        stopBtn.disabled = false;
        if (faceLandmarker) setStatus("");
        rafId = requestAnimationFrame(loop);
      } catch (err) {
        setStatus(`Couldn't start camera: ${err.name === "NotAllowedError" ? "permission denied" : err.message}`);
      }
    }

    function stopCamera() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      stream?.getTracks().forEach((t) => t.stop());
      stream = null;
      video.srcObject = null;
      lastVideoTime = -1;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    // Runs every frame. Draw on `ctx` in raw (un-mirrored) video pixel
    // coordinates; CSS mirrors the overlay along with the video.
    function onFrame(now) {
      // Only run detection when the camera has produced a new frame.
      if (!faceLandmarker || video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const result = faceLandmarker.detectForVideo(video, now);
      ctx.clearRect(0, 0, overlay.width, overlay.height);

      // One green dot per landmark (478 per face). Landmarks are normalized 0‚Äì1.
      const radius = Math.max(1.5, overlay.width / 640);
      ctx.fillStyle = "#00ff00";
      for (const face of result.faceLandmarks) {
        for (const p of face) {
          ctx.beginPath();
          ctx.arc(p.x * overlay.width, p.y * overlay.height, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function loop(now) {
      if (video.readyState >= 2) onFrame(now);
      rafId = requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    cameraSelect.addEventListener("change", () => {
      if (stream) startCamera();
    });

    loadFaceLandmarker().catch((err) => setStatus(`Couldn't load face model: ${err.message}`));
  </script>
</body>
</html>
