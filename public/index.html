<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scare Score</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #eee;
    }

    main {
      width: min(960px, 100% - 32px);
      display: grid;
      gap: 12px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Mirror both the video and the overlay together, so landmarks drawn in
       raw video coordinates line up with the mirrored image. */
    .stage video,
    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, select {
      font: inherit;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; cursor: default; }

    .status { margin: 0; color: #aaa; min-height: 1.2em; }

    .meters {
      display: grid;
      gap: 8px;
      padding: 14px;
      border-radius: 12px;
      background: #1a1a1a;
    }

    .score {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-weight: 600;
    }

    .score span:last-child { font-size: 2rem; color: #ff4d4d; }

    .score small { margin-left: 8px; font-weight: normal; color: #aaa; }

    .meter {
      display: grid;
      grid-template-columns: 7.5em 1fr 3ch;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }

    .bar {
      height: 10px;
      border-radius: 5px;
      background: #333;
      overflow: hidden;
    }

    .bar div {
      height: 100%;
      width: 0;
      background: #00ff00;
    }

    .meter .value { text-align: right; color: #aaa; }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <!-- Overlay for drawing (e.g. MediaPipe face landmarks later). -->
      <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
      <button id="start">Start camera + mic</button>
      <button id="stop" disabled>Stop</button>
      <select id="cameras" aria-label="Camera" hidden></select>
    </div>
    <p id="status" class="status"></p>

    <section class="meters">
      <div class="score"><span>Scare score<small id="peak">peak 0</small></span><span id="score">0</span></div>
      <div id="meters"></div>
    </section>
  </main>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
    const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const cameraSelect = document.getElementById("cameras");
    const statusEl = document.getElementById("status");
    const scoreEl = document.getElementById("score");
    const peakEl = document.getElementById("peak");
    const metersEl = document.getElementById("meters");

    // What makes up the scare score. `read(face)` returns a raw value, where
    // `face` is { shapes, flinch } or null when no face is in view.
    // `max` is roughly the raw value of a big scare, so the meter can fill up.
    // `weight` is how much that meter counts toward the score.
    const QUALITIES = [
      { label: "Scream", weight: 2, max: 0.3, read: () => micVolume() },
      // Ignores slow head movement (under 0.5 face-widths/sec) so normal fidgeting doesn't count.
      { label: "Flinch", weight: 1.5, max: 2.5, read: (face) => Math.max(0, (face?.flinch ?? 0) - 0.5) },
      { label: "Mouth open", weight: 1, max: 0.6, read: (face) => face?.shapes.jawOpen ?? 0 },
      { label: "Eyes wide", weight: 1, max: 0.5, read: (face) => face ? (face.shapes.eyeWideLeft + face.shapes.eyeWideRight) / 2 : 0 },
      { label: "Brows raised", weight: 1, max: 0.7, read: (face) => face?.shapes.browInnerUp ?? 0 },
    ];
    const TOTAL_WEIGHT = QUALITIES.reduce((sum, q) => sum + q.weight, 0);

    for (const q of QUALITIES) {
      const row = document.createElement("div");
      row.className = "meter";
      row.innerHTML = `<span>${q.label}</span><div class="bar"><div></div></div><span class="value">0</span>`;
      metersEl.append(row);
      q.fill = row.querySelector(".bar div");
      q.valueEl = row.querySelector(".value");
      q.level = 0;
    }

    let stream = null;
    let rafId = null;
    let faceLandmarker = null;
    let lastVideoTime = -1;
    let audioCtx = null;
    let analyser = null;
    let audioBuf = null;
    let lastNose = null; // { x, y, t } for measuring head speed
    let peak = 0;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    async function loadFaceLandmarker() {
      setStatus("Loading face model...");
      const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
      const options = (delegate) => ({
        baseOptions: { modelAssetPath: MODEL_URL, delegate },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: true,
      });
      try {
        faceLandmarker = await FaceLandmarker.createFromOptions(fileset, options("GPU"));
      } catch {
        faceLandmarker = await FaceLandmarker.createFromOptions(fileset, options("CPU"));
      }
      if (!stream) setStatus("");
    }

    function setupMic(micStream) {
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      audioBuf = new Float32Array(analyser.fftSize);
      audioCtx.createMediaStreamSource(micStream).connect(analyser);
    }

    // Loudness of the mic right now (RMS, 0 = silent, ~0.3+ = screaming).
    function micVolume() {
      if (!analyser) return 0;
      analyser.getFloatTimeDomainData(audioBuf);
      let sum = 0;
      for (const v of audioBuf) sum += v * v;
      return Math.sqrt(sum / audioBuf.length);
    }

    async function listCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter((d) => d.kind === "videoinput");
      const current = cameraSelect.value;
      cameraSelect.innerHTML = "";
      cams.forEach((cam, i) => {
        const opt = document.createElement("option");
        opt.value = cam.deviceId;
        opt.textContent = cam.label || `Camera ${i + 1}`;
        cameraSelect.append(opt);
      });
      if (current) cameraSelect.value = current;
      cameraSelect.hidden = cams.length < 2;
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("This browser can't access the camera (needs HTTPS or localhost).");
        return;
      }
      stopCamera();
      try {
        const deviceId = cameraSelect.value;
        const videoOpts = deviceId
          ? { deviceId: { exact: deviceId } }
          : { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" };
        // Turn off the browser's voice processing so a scream reads as loud.
        const audioOpts = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
        let micStatus = "";
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: videoOpts, audio: audioOpts });
        } catch {
          stream = await navigator.mediaDevices.getUserMedia({ video: videoOpts, audio: false });
          micStatus = "No mic access, so the Scream meter is off.";
        }
        if (stream.getAudioTracks().length) setupMic(stream);
        video.srcObject = stream;
        await video.play();

        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;

        await listCameras(); // labels are only available after permission is granted
        startBtn.disabled = true;
        stopBtn.disabled = false;
        if (faceLandmarker || micStatus) setStatus(micStatus);
        rafId = requestAnimationFrame(loop);
      } catch (err) {
        setStatus(`Couldn't start camera: ${err.name === "NotAllowedError" ? "permission denied" : err.message}`);
      }
    }

    function stopCamera() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      stream?.getTracks().forEach((t) => t.stop());
      stream = null;
      video.srcObject = null;
      audioCtx?.close();
      audioCtx = null;
      analyser = null;
      lastVideoTime = -1;
      lastNose = null;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      resetMeters();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    // Runs every frame. Draw on `ctx` in raw (un-mirrored) video pixel
    // coordinates; CSS mirrors the overlay along with the video.
    function onFrame(now) {
      // Only run detection when the camera has produced a new frame.
      if (!faceLandmarker || video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const result = faceLandmarker.detectForVideo(video, now);
      ctx.clearRect(0, 0, overlay.width, overlay.height);

      // One green dot per landmark (478 per face). Landmarks are normalized 0-1.
      const radius = Math.max(1.5, overlay.width / 640);
      ctx.fillStyle = "#00ff00";
      for (const face of result.faceLandmarks) {
        for (const p of face) {
          ctx.beginPath();
          ctx.arc(p.x * overlay.width, p.y * overlay.height, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      updateMeters(readFace(result, now));
    }

    // Turns a MediaPipe result into { shapes, flinch }, or null if no face.
    function readFace(result, now) {
      const landmarks = result.faceLandmarks[0];
      if (!landmarks) {
        lastNose = null;
        return null;
      }

      const shapes = {};
      for (const c of result.faceBlendshapes[0].categories) shapes[c.categoryName] = c.score;

      // Flinch = how fast the head moves, in face-widths per second, so it
      // works the same whether you're close to or far from the camera.
      // Landmark 1 is the nose tip; 234 and 454 are the sides of the face.
      const px = (p) => ({ x: p.x * overlay.width, y: p.y * overlay.height });
      const nose = px(landmarks[1]);
      const left = px(landmarks[234]);
      const right = px(landmarks[454]);
      const faceWidth = Math.hypot(right.x - left.x, right.y - left.y);
      let flinch = 0;
      if (lastNose && now > lastNose.t) {
        const moved = Math.hypot(nose.x - lastNose.x, nose.y - lastNose.y) / faceWidth;
        flinch = moved / ((now - lastNose.t) / 1000);
      }
      lastNose = { ...nose, t: now };

      return { shapes, flinch };
    }

    function updateMeters(face) {
      let total = 0;
      for (const q of QUALITIES) {
        const target = Math.min(1, q.read(face) / q.max);
        // Jump up fast, fall back slowly, so a quick scream or flinch registers.
        q.level += (target - q.level) * (target > q.level ? 0.5 : 0.08);
        total += q.level * q.weight;
      }
      const score = Math.round((total / TOTAL_WEIGHT) * 100);
      peak = Math.max(peak, score);
      renderMeters(score);
    }

    function resetMeters() {
      for (const q of QUALITIES) q.level = 0;
      peak = 0;
      renderMeters(0);
    }

    function renderMeters(score) {
      for (const q of QUALITIES) {
        q.fill.style.width = `${q.level * 100}%`;
        q.valueEl.textContent = Math.round(q.level * 100);
      }
      scoreEl.textContent = score;
      peakEl.textContent = `peak ${peak}`;
    }

    function loop(now) {
      if (video.readyState >= 2) onFrame(now);
      rafId = requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    cameraSelect.addEventListener("change", () => {
      if (stream) startCamera();
    });

    loadFaceLandmarker().catch((err) => setStatus(`Couldn't load face model: ${err.message}`));
  </script>
</body>
</html>
